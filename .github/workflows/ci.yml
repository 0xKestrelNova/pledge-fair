name: CI

# Vérifie la logique du générateur de données à chaque push et pull request.
# Distinct de update-data.yml, qui régénère docs/data.json une fois par jour :
# ici on ne touche pas aux données, on valide seulement le code.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Image épinglée plutôt que `ubuntu-latest` : ce label migre vers Ubuntu 26
    # à partir du 19/10/2026. Une bascule d'image silencieuse est exactement le
    # genre de changement externe qu'on préfère déclencher soi-même plutôt que
    # découvrir par un job rouge — le catalogue Standalone Ships en a déjà fait
    # la démonstration. À repasser sur une image plus récente une fois la
    # migration validée : c'est un mot à changer.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # docs/version.json est lu par le pied de page du site. Sans ce
      # contrôle il dériverait silencieusement de package.json, comme le
      # formatage dérivait avant `format:check`.
      - name: Version check
        run: npm run sync-version:check

      - name: Test
        run: npm test
